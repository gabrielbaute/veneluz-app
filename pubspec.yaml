name: veneluz_app
description: "A android client for Veneluz server"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  go_router: ^18.0.1
  package_info_plus: ^10.2.1
  provider: ^6.1.5+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_post_build: ^1.3.0

flutter_post_builder:
  package_name: "veneluz_app"
  append_version: true
  final_directory: "./release"
  move_files: true
  discard:
    v7a: false
    a64: false
    x86: false
    uni: false
  clean_build_folder: true

flutter:
  uses-material-design: true
